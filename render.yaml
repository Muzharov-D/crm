services:
  - type: web
    name: crm
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.12.0"
      - key: SESSION_SECRET
        generateValue: true
      - key: CRM_USERS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: crm-db
          property: connectionString

databases:
  - name: crm-db
    region: frankfurt
    plan: basic-256mb
    databaseName: crm
    user: crm
